name: Update travel coordinates

on:
  push:
    branches: [master]
    paths:
      - '_data/*_travel.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Look up coordinates for new cities
        run: ruby _scripts/update_travel_coordinates.rb

      - name: Commit updated coordinates
        id: commit
        run: |
          if git diff --quiet -- _data/travel_coordinates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/travel_coordinates.json
            git commit -m "Update travel coordinates"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made by this workflow don't trigger a Pages build on their own
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
